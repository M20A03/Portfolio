<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="720" cy="100" r="160" fill="#38bdf8" opacity="0.15" filter="blur(40px)"/>
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="60" y="60" width="680" height="55" rx="12" fill="#0369a1" fill-opacity="0.4"/>
  <text x="90" y="95" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#38bdf8">🩺 SAKHTI DENTAL CLINIC</text>
  <text x="360" y="94" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#bae6fd">Healthcare &amp; Patient Portal</text>
  <rect x="580" y="73" width="140" height="32" rx="16" fill="url(#cyanGrad)"/>
  <text x="650" y="94" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Book Appointment</text>

  <!-- Left: Service Highlights -->
  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="340" height="245" rx="14" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="20" y="35" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">Dental Services &amp; Treatments</text>
    
    <rect x="20" y="55" width="300" height="45" rx="8" fill="#0369a1" fill-opacity="0.3"/>
    <text x="35" y="82" font-family="system-ui, sans-serif" font-size="14" fill="#e0f2fe">✨ Teeth Whitening &amp; Cosmetic</text>
    
    <rect x="20" y="110" width="300" height="45" rx="8" fill="#0369a1" fill-opacity="0.3"/>
    <text x="35" y="137" font-family="system-ui, sans-serif" font-size="14" fill="#e0f2fe">🦷 Orthodontics &amp; Braces</text>
    
    <rect x="20" y="165" width="300" height="45" rx="8" fill="#0369a1" fill-opacity="0.3"/>
    <text x="35" y="192" font-family="system-ui, sans-serif" font-size="14" fill="#e0f2fe">🛡️ Root Canal &amp; Dental Surgery</text>
  </g>

  <!-- Right: Patient Form Preview -->
  <g transform="translate(420, 135)">
    <rect x="0" y="0" width="320" height="245" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#38bdf8">Patient Registration</text>
    
    <rect x="20" y="50" width="280" height="35" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Patient Name: John Doe</text>

    <rect x="20" y="95" width="280" height="35" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="117" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Date &amp; Time: Aug 15, 2026 - 10:00 AM</text>

    <rect x="20" y="140" width="280" height="35" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="162" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Select Doctor: Dr. Sakhti BDS, MDS</text>

    <rect x="20" y="190" width="280" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="160" y="215" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">Confirm Appointment</text>
  </g>
</svg>
