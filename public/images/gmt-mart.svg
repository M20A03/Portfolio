<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="180" fill="#10b981" opacity="0.12" filter="blur(40px)"/>
  <rect x="50" y="50" width="700" height="350" rx="16" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="70" y="70" width="660" height="50" rx="10" fill="#022c22" fill-opacity="0.8"/>
  <text x="100" y="102" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#10b981">GMT MART</text>
  <text x="230" y="101" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#a7f3d0">Online Grocery &amp; Retail Storefront</text>
  <rect x="580" y="80" width="130" height="30" rx="15" fill="url(#accent)"/>
  <text x="645" y="100" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#022c22" text-anchor="middle">🛍️ Cart (3)</text>

  <!-- Product Cards Grid -->
  <g transform="translate(70, 140)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="200" height="230" rx="12" fill="#047857" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="15" y="15" width="170" height="110" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <text x="100" y="80" font-size="44" text-anchor="middle">🍎</text>
    <text x="20" y="150" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Fresh Produce</text>
    <text x="20" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#6ee7b7">Daily Harvest</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#10b981">$4.99</text>
    <rect x="135" y="185" width="50" height="28" rx="6" fill="#10b981"/>
    <text x="160" y="204" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#022c22" text-anchor="middle">+ Add</text>

    <!-- Card 2 -->
    <rect x="230" y="0" width="200" height="230" rx="12" fill="#047857" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="245" y="15" width="170" height="110" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <text x="330" y="80" font-size="44" text-anchor="middle">🥦</text>
    <text x="250" y="150" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Organic Greens</text>
    <text x="250" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#6ee7b7">Farm Essentials</text>
    <text x="250" y="205" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#10b981">$3.49</text>
    <rect x="365" y="185" width="50" height="28" rx="6" fill="#10b981"/>
    <text x="390" y="204" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#022c22" text-anchor="middle">+ Add</text>

    <!-- Card 3 -->
    <rect x="460" y="0" width="200" height="230" rx="12" fill="#047857" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="475" y="15" width="170" height="110" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <text x="560" y="80" font-size="44" text-anchor="middle">🍞</text>
    <text x="480" y="150" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Artisan Bakery</text>
    <text x="480" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#6ee7b7">Freshly Baked</text>
    <text x="480" y="205" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#10b981">$2.99</text>
    <rect x="595" y="185" width="50" height="28" rx="6" fill="#10b981"/>
    <text x="620" y="204" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#022c22" text-anchor="middle">+ Add</text>
  </g>
</svg>
