<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="200" fill="#a855f7" opacity="0.12" filter="blur(50px)"/>
  
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#09090b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Header -->
  <text x="70" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#c084fc">👁️ YOLOv11 COMPUTER VISION SYSTEM</text>
  <text x="500" y="84" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#a855f7">Christ University AI Research</text>

  <!-- Bounding Boxes Visualizer Mockup -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="660" height="270" rx="12" fill="#18181b" stroke="#27272a"/>
    
    <!-- Video Feed Frame -->
    <rect x="20" y="20" width="400" height="230" rx="8" fill="#09090b" stroke="#3f3f46"/>
    
    <!-- Object Detection Box 1 -->
    <rect x="50" y="50" width="140" height="150" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="50" y="32" width="100" height="18" fill="#a855f7"/>
    <text x="55" y="45" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ffffff">Person: 98.4%</text>

    <!-- Object Detection Box 2 -->
    <rect x="220" y="80" width="170" height="130" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <rect x="220" y="62" width="110" height="18" fill="#06b6d4"/>
    <text x="225" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#09090b">Vehicle: 96.8%</text>

    <!-- Right Neural Metrics -->
    <g transform="translate(440, 20)">
      <rect x="0" y="0" width="200" height="230" rx="8" fill="#09090b" stroke="#3f3f46"/>
      <text x="15" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#a855f7">Model Metrics</text>

      <text x="15" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">FPS: <tspan fill="#22c55e" font-weight="700">120 FPS</tspan></text>
      <text x="15" y="85" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">mAP@50: <tspan fill="#38bdf8" font-weight="700">92.6%</tspan></text>
      <text x="15" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Backbone: <tspan fill="#e879f9" font-weight="700">YOLOv11x</tspan></text>
      <text x="15" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Inference: <tspan fill="#eab308" font-weight="700">3.2 ms</tspan></text>

      <rect x="15" y="170" width="170" height="35" rx="6" fill="url(#purpleGlow)"/>
      <text x="100" y="192" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Confidential Research</text>
    </g>
  </g>
</svg>
