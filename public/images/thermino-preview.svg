<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="33%" stop-color="#22c55e"/>
      <stop offset="66%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="#f97316" opacity="0.15" filter="blur(50px)"/>
  
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#09090b" fill-opacity="0.8" stroke="#f97316" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Header -->
  <text x="70" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#f97316">🔥 THERMINO THERMAL ANALYTICS SYSTEM</text>
  <text x="500" y="84" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#fdba74">Christ University AI Research</text>

  <!-- Heatmap Visualizer -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="660" height="270" rx="12" fill="#18181b" stroke="#27272a"/>
    
    <!-- Heatmap Grid Frame -->
    <rect x="20" y="20" width="400" height="230" rx="8" fill="#09090b" stroke="#3f3f46"/>
    
    <!-- Thermal Gradient Circles -->
    <circle cx="150" cy="120" r="70" fill="#ef4444" opacity="0.7" filter="blur(15px)"/>
    <circle cx="150" cy="120" r="35" fill="#f97316" opacity="0.9" filter="blur(8px)"/>
    <circle cx="280" cy="150" r="50" fill="#eab308" opacity="0.6" filter="blur(12px)"/>
    <circle cx="320" cy="80" r="40" fill="#3b82f6" opacity="0.5" filter="blur(10px)"/>

    <text x="150" y="125" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">84.2°C</text>
    <text x="280" y="155" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">62.0°C</text>

    <!-- Legend Bar -->
    <rect x="35" y="215" width="370" height="15" rx="7.5" fill="url(#heatGrad)"/>
    <text x="35" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#a1a1aa">20°C</text>
    <text x="385" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#a1a1aa">100°C</text>

    <!-- Right Side Analytics -->
    <g transform="translate(440, 20)">
      <rect x="0" y="0" width="200" height="230" rx="8" fill="#09090b" stroke="#3f3f46"/>
      <text x="15" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#f97316">Thermal Metrics</text>

      <text x="15" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Max Temp: <tspan fill="#ef4444" font-weight="700">84.2 °C</tspan></text>
      <text x="15" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Min Temp: <tspan fill="#3b82f6" font-weight="700">22.4 °C</tspan></text>
      <text x="15" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Gradient: <tspan fill="#eab308" font-weight="700">Normal</tspan></text>
      <text x="15" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Anomaly: <tspan fill="#22c55e" font-weight="700">None</tspan></text>

      <rect x="15" y="170" width="170" height="35" rx="6" fill="#f97316"/>
      <text x="100" y="192" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Confidential Software</text>
    </g>
  </g>
</svg>
